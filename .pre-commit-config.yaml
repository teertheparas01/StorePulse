repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3

  # - repo: https://github.com/pre-commit/mirrors-mypy
#     rev: v1.9.0
#     hooks:
#       - id: mypy
#         additional_dependencies: [pandas, numpy, lightgbm, mlflow, scipy, scikit-learn, pyyaml, flask]
#         args: [--ignore-missing-imports, --no-error-summary, --exclude=numpy, --python-version=3.12, --disable-error-code=no-untyped-def, --disable-error-code=import-untyped, --disable-error-code=assignment, --disable-error-code=attr-defined, --disable-error-code=arg-type, --disable-error-code=misc, --exclude=tests/, --exclude=scripts/, --exclude=notebooks/, --exclude=.cache/pre-commit/, --exclude=.cache/pre-commit/repoe0z_7ph_]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
