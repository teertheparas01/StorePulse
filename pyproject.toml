[project]
name = "retail-decision-intelligence"
version = "0.1.0"
description = "ML-powered retail decision intelligence system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "lightgbm>=4.0",
    "mlflow>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "flask>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]
per-file-ignores = { "notebooks/*" = ["ALL"], "scripts/*" = ["ALL"], "src/pipeline/ml/train*.py" = ["T201", "UP038"], "src/pipeline/ml/serve.py" = ["T201", "E402"], "src/pipeline/ml/monitor.py" = ["T201", "E402"], "src/pipeline/ml/backtest.py" = ["T201", "F841", "B007"], "src/pipeline/ml/registry.py" = ["T201", "F841"], "src/pipeline/ml/train_hurdle.py" = ["T201", "F841"], "src/pipeline/features/demand_features.py" = ["T201", "B007"], "src/pipeline/validation/validate.py" = ["T201"], "src/pipeline/ml/train.py" = ["T201", "UP038"], "src/pipeline/run_pipeline.py" = ["T201"], "tests/*" = ["T201"], "inspect_*.py" = ["T201"], "jan_*.py" = ["T201"], "src/storepulse/seed.py" = ["T201"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"
exclude = "/(\\.git|\\.venv|notebooks|scripts)/"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
exclude = "notebooks|scripts|data|models|monitoring|backtest_results|htmlcov|.mypy_cache|.ruff_cache|__pycache__|.pytest_cache|.venv"

[tool.mypy-overrides]
module = "numpy,*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --cov=src --cov-report=term-missing --cov-report=html"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/notebooks/*", "*/scripts/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
